<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Shop | Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: white; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-admin { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 8px; color: white; outline: none; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <div class="max-w-7xl mx-auto space-y-6">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center glass p-6 rounded-3xl gap-4">
            <div>
                <h1 class="text-2xl font-black text-blue-400">PANEL ADMINISTRADOR</h1>
                <p class="text-xs text-gray-400">Conectado en tiempo real con la tienda</p>
            </div>
        </div>

        <div class="glass rounded-3xl p-6 border border-indigo-500/30 bg-indigo-950/10">
            <h2 class="text-sm font-bold text-indigo-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                <span>📢</span> Notificación Global (Para todos los usuarios de la tienda)
            </h2>
            <div class="flex flex-col md:flex-row gap-2">
                <input type="text" id="input-notificacion-global" placeholder="Ej: ¡Ofertas activas! O mantenimiento programado..." class="input-admin flex-1 text-xs">
                <div class="flex gap-2">
                    <button onclick="publicarNotificacionGlobal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-xl text-xs uppercase transition">Publicar</button>
                    <button onclick="borrarNotificacionGlobal()" class="bg-red-600/30 hover:bg-red-600/50 text-red-300 border border-red-500/30 font-bold px-3 py-2 rounded-xl text-xs uppercase transition">Quitar</button>
                </div>
            </div>
        </div>

        <div class="glass rounded-3xl p-6 overflow-x-auto">
            <h2 class="text-lg font-bold mb-4">Pedidos Recibidos</h2>
            <table class="w-full text-left text-xs">
                <thead>
                    <tr class="border-b border-white/10 text-gray-400 uppercase">
                        <th class="p-3">ID / Fecha</th>
                        <th class="p-3">Arma / Cant</th>
                        <th class="p-3">Cliente</th>
                        <th class="p-3">Precio ($)</th>
                        <th class="p-3">Comprobante</th>
                        <th class="p-3">Enviar Servidor</th>
                        <th class="p-3">Notificación de Aviso</th>
                        <th class="p-3 text-center">Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-pedidos" class="divide-y divide-white/5">
                    <tr><td colspan="8" class="text-center p-6 text-gray-400 font-bold">Cargando pedidos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="modal-comprobante" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center z-[100] p-4">
        <div class="bg-[#0b0f19] border border-white/10 max-w-lg w-full rounded-3xl p-6 relative shadow-2xl text-center">
            <button onclick="cerrarModalComprobante()" class="absolute top-4 right-4 text-gray-400 hover:text-white font-bold text-xl">✕</button>
            <h3 class="text-lg font-bold mb-4 text-blue-400">Comprobante de Pago</h3>
            <div class="max-h-[70vh] overflow-y-auto rounded-xl border border-white/10 p-2 bg-black/40">
                <img id="img-comprobante-preview" src="" class="w-full object-contain rounded-lg">
            </div>
            <button onclick="cerrarModalComprobante()" class="mt-4 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-6 rounded-xl text-xs uppercase">
                Cerrar
            </button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCScDrnMGvBQh8g7Z2yCkwtWqdVNu8fqJI",
            authDomain: "pepe-58c72.firebaseapp.com",
            databaseURL: "https://pepe-58c72-default-rtdb.firebaseio.com",
            projectId: "pepe-58c72",
            storageBucket: "pepe-58c72.firebasestorage.app",
            messagingSenderId: "964204938889",
            appId: "1:964204938889:web:c0c1ef98e9396649e4a858"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let pedidosData = {};

        // Escuchar Notificación Global Actual
        db.ref('notificacion_global').on('value', (snapshot) => {
            const val = snapshot.val();
            if (val) {
                document.getElementById('input-notificacion-global').value = val;
            } else {
                document.getElementById('input-notificacion-global').value = '';
            }
        });

        function publicarNotificacionGlobal() {
            const msg = document.getElementById('input-notificacion-global').value;
            db.ref('notificacion_global').set(msg)
            .then(() => alert('Notificación global actualizada para todos los clientes.'))
            .catch(err => alert('Error: ' + err.message));
        }

        function borrarNotificacionGlobal() {
            db.ref('notificacion_global').remove()
            .then(() => {
                document.getElementById('input-notificacion-global').value = '';
                alert('Notificación global quitada.');
            });
        }

        // Escuchar cambios de la base de datos en vivo
        db.ref('pedidos').on('value', (snapshot) => {
            const data = snapshot.val();
            pedidosData = data || {};
            const tbody = document.getElementById('tabla-pedidos');
            tbody.innerHTML = '';

            if (!data) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center p-6 text-gray-500 font-bold">No hay pedidos pendientes.</td></tr>`;
                return;
            }

            Object.keys(data).reverse().forEach((key) => {
                const p = data[key];

                tbody.innerHTML += `
                    <tr class="hover:bg-white/5 transition">
                        <td class="p-3">
                            <p class="font-bold text-blue-400">${p.id}</p>
                            <p class="text-[10px] text-gray-400">${p.fecha}</p>
                        </td>
                        <td class="p-3">
                            <p class="font-bold text-white">${p.arma}</p>
                            <p class="text-[10px] text-gray-400">Cantidad: ${p.cantidad}</p>
                        </td>
                        <td class="p-3">
                            <p class="text-white font-bold">${p.titular}</p>
                            <p class="text-blue-300 text-[10px]">🎮 ${p.roblox} | 💬 ${p.discord}</p>
                            <p class="text-gray-400 text-[10px]">📱 ${p.nequi}</p>
                        </td>
                        <td class="p-3">
                            ${p.precio 
                                ? `<span class="text-emerald-400 font-bold">$${Number(p.precio).toLocaleString('es-CO')}</span>`
                                : `<div class="flex gap-1">
                                    <input type="number" id="input-precio-${p.id}" placeholder="Precio" class="input-admin w-20 text-xs">
                                    <button onclick="asignarPrecio('${p.id}')" class="bg-blue-600 hover:bg-blue-500 px-2 py-1 rounded text-[10px] font-bold">OK</button>
                                   </div>`
                            }
                        </td>
                        <td class="p-3">
                            ${p.comprobante 
                                ? `<button onclick="verComprobante('${p.id}')" class="bg-purple-600/30 text-purple-300 border border-purple-500/30 px-3 py-1 rounded-lg text-[10px] font-bold hover:bg-purple-600/50 transition">👁️ Ver Foto</button>`
                                : `<span class="text-gray-500 italic">Pendiente...</span>`
                            }
                        </td>
                        <td class="p-3">
                            ${p.comprobante 
                                ? (p.serverLink 
                                    ? `<span class="text-green-400 font-bold">Enviado</span>`
                                    : `<div class="flex gap-1">
                                        <input type="url" id="input-link-${p.id}" placeholder="https://roblox.com/..." class="input-admin w-32 text-xs">
                                        <button onclick="enviarLinkServidor('${p.id}')" class="bg-emerald-600 hover:bg-emerald-500 px-2 py-1 rounded text-[10px] font-bold">Enviar</button>
                                       </div>`
                                  )
                                : `<span class="text-gray-600">Esperando Pago...</span>`
                            }
                        </td>
                        <td class="p-3">
                            <div class="flex flex-col gap-1">
                                <input type="text" id="input-aviso-${p.id}" value="${p.notificacionAviso || ''}" placeholder="Aviso p. ej: Pago incompleto" class="input-admin w-36 text-[11px]">
                                <button onclick="enviarAvisoPedido('${p.id}')" class="bg-yellow-600/80 hover:bg-yellow-500 text-white px-2 py-1 rounded text-[10px] font-bold">Enviar Aviso</button>
                            </div>
                        </td>
                        <td class="p-3 text-center">
                            <button onclick="borrarPedido('${p.id}')" class="text-red-400 hover:text-red-600 font-bold">🗑️</button>
                        </td>
                    </tr>
                `;
            });
        });

        function verComprobante(id) {
            const pedido = pedidosData[id];
            if (pedido && pedido.comprobante) {
                document.getElementById('img-comprobante-preview').src = pedido.comprobante;
                document.getElementById('modal-comprobante').classList.remove('hidden');
            }
        }

        function cerrarModalComprobante() {
            document.getElementById('modal-comprobante').classList.add('hidden');
            document.getElementById('img-comprobante-preview').src = '';
        }

        function asignarPrecio(id) {
            const val = document.getElementById(`input-precio-${id}`).value;
            if(!val) return alert('Ingresa un precio válido.');
            db.ref('pedidos/' + id).update({ precio: val });
        }

        function enviarLinkServidor(id) {
            const link = document.getElementById(`input-link-${id}`).value;
            if(!link) return alert('Ingresa el link del servidor.');
            db.ref('pedidos/' + id).update({ serverLink: link });
        }

        function enviarAvisoPedido(id) {
            const aviso = document.getElementById(`input-aviso-${id}`).value;
            db.ref('pedidos/' + id).update({ notificacionAviso: aviso })
            .then(() => alert('Notificación de aviso enviada al pedido ' + id));
        }

        function borrarPedido(id) {
            if(confirm('¿Eliminar este pedido?')) {
                db.ref('pedidos/' + id).remove();
            }
        }
    </script>
</body>
</html>
